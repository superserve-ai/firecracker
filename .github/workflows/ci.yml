name: CI

on:
  pull_request:
  push:
    branches: [feat/block-overlay-cow-v1.15]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Bare container images make the runner fall back to `sh`, where
# `set -o pipefail` is not supported.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build + glibc ceiling
    runs-on: ubuntu-latest
    # The container base, not a cargo flag, sets the glibc a binary is linked
    # against — and it can only run where glibc is at least that new. Build on
    # the oldest supported target (22.04 / glibc 2.35), not the runner default.
    container: ubuntu:22.04
    steps:
      # Before checkout: the bare image has no git or CA certs, without which
      # checkout silently degrades to a tarball download.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            binutils build-essential ca-certificates clang curl file git libclang-dev \
            libseccomp-dev linux-libc-dev pkg-config

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.93.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --release -p firecracker

      # A binary over the ceiling builds and tests clean here and is simply
      # unloadable on an older target, so nothing else in CI would catch it.
      - name: Verify glibc symbol ceiling
        run: |
          set -euo pipefail
          bin=build/cargo_target/release/firecracker
          ceiling=GLIBC_2.34
          max=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "highest glibc symbol required: $max (ceiling $ceiling)"
          if [ "$(printf '%s\n%s\n' "$max" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]; then
            echo "::error::binary requires $max, above the $ceiling ceiling — a glibc 2.35 target would refuse to load it"
            exit 1
          fi

      # Supervisors gate features on advertised capabilities, so dropping one
      # degrades a deployment quietly rather than failing at install time.
      - name: Verify version and advertised capabilities
        run: |
          set -euo pipefail
          bin=build/cargo_target/release/firecracker
          "$bin" --version
          if ! "$bin" --version | grep -qE '^[[:space:]]*capability: serial-console-cap[[:space:]]*$'; then
            echo "::error::binary does not advertise serial-console-cap — a supervisor gating on it would refuse this binary"
            exit 1
          fi

      - name: Record artifact identity
        run: |
          set -euo pipefail
          bin=build/cargo_target/release/firecracker
          sha256sum "$bin" | tee firecracker.sha256
          file "$bin"

      # Publishing the digest makes installing "fetch and verify" rather than
      # a rebuild whose bytes nobody can predict.
      - uses: actions/upload-artifact@v4
        with:
          name: firecracker-${{ github.sha }}
          path: |
            build/cargo_target/release/firecracker
            firecracker.sha256
          if-no-files-found: error
          retention-days: 30

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates clang curl git libclang-dev \
            libseccomp-dev linux-libc-dev pkg-config

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.93.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Non-failing probe: most vmm lib tests and every microVM-booting test
      # need /dev/kvm, so until a runner provides it the steps below cover only
      # the hardware-free subset.
      - name: Probe hardware available to this runner
        run: |
          echo "kvm:  $(test -e /dev/kvm && ls -l /dev/kvm || echo absent)"
          echo "tun:  $(test -e /dev/net/tun && ls -l /dev/net/tun || echo absent)"
          echo "kernel: $(uname -r)"

      - name: API server and request-parsing tests
        run: cargo test --bin firecracker

      - name: Overlay block engine tests
        run: cargo test -p vmm --lib overlay

      - name: Delta (clone) tests
        run: cargo test -p vmm --lib delta

      - name: In-process UFFD handler tests
        run: cargo test -p vmm --lib uffd_internal

  # TEMPORARY probe: does the runner HOST expose /dev/kvm? The containerised
  # probe above cannot tell us, since container jobs get no devices unless
  # they are passed explicitly.
  host-probe:
    name: Host hardware probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          echo "kvm: $(test -e /dev/kvm && ls -l /dev/kvm || echo absent)"
          echo "tun: $(test -e /dev/net/tun && ls -l /dev/net/tun || echo absent)"
          echo "kernel: $(uname -r)"
          echo "groups: $(id)"
          echo "--- after the standard permission fix ---"
          sudo apt-get install -y -qq acl >/dev/null 2>&1 || true
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm && echo "kvm READABLE+WRITABLE" || echo "kvm NOT accessible"
          fi
